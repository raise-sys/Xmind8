name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Publish
        run: dotnet publish Xmind8.csproj -c Release -o publish

      - name: Set base path and SPA fallback
        shell: pwsh
        run: |
          $site = "publish/wwwroot"
          $index = Join-Path $site "index.html"
          $html = Get-Content $index -Raw
          $html = $html.Replace('<base href="/" />', '<base href="${{ steps.pages.outputs.base_path }}/" />')
          Set-Content $index $html -NoNewline
          Copy-Item $index (Join-Path $site "404.html")
          New-Item (Join-Path $site ".nojekyll") -ItemType File -Force

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
